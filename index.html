<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte a WhatsApp</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 15px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
      transition: border 0.2s, background 0.2s;
      scroll-margin-top: 100px; /* evita que un header fijo tape el campo */
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .campo-error {
      border: 2px solid #e53935 !important;
      background: #ffebee !important;
    }

    .error-msg {
      color: #e53935;
      font-size: 14px;
      margin-top: 4px;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .checkbox-group label {
      font-weight: 400;
      margin: 0;
    }

    button {
      background: #25D366;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background: #1ebe5d;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <h1>Enviar reporte</h1>

  <form id="reporteForm" novalidate>
    <div class="campo">
      <label for="nombre">Nombre completo *</label>
      <input type="text" id="nombre" name="nombre" data-label="Nombre completo" required>
      <div class="error-msg">Este campo es obligatorio</div>
    </div>

    <div class="campo">
      <label for="telefono">Teléfono *</label>
      <input type="tel" id="telefono" name="telefono" data-label="Teléfono" required>
      <div class="error-msg">Este campo es obligatorio</div>
    </div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" data-label="Correo electrónico">
      <div class="error-msg">Ingresa un correo válido</div>
    </div>

    <div class="campo">
      <label for="categoria">Categoría *</label>
      <select id="categoria" name="categoria" data-label="Categoría" required>
        <option value="">Selecciona una opción</option>
        <option value="Soporte">Soporte</option>
        <option value="Ventas">Ventas</option>
        <option value="Queja">Queja</option>
        <option value="Sugerencia">Sugerencia</option>
      </select>
      <div class="error-msg">Este campo es obligatorio</div>
    </div>

    <div class="campo">
      <label for="detalle">Detalle del reporte *</label>
      <textarea id="detalle" name="detalle" data-label="Detalle" rows="4" required></textarea>
      <div class="error-msg">Este campo es obligatorio</div>
    </div>

    <div class="campo">
      <div class="checkbox-group">
        <input type="checkbox" id="acepto" name="acepto" data-label="Acepto términos" required>
        <label for="acepto">Acepto los términos y condiciones *</label>
      </div>
      <div class="error-msg">Debes aceptar los términos</div>
    </div>

    <button type="button" id="btnEnviar">Enviar a WhatsApp</button>
  </form>

  <script>
    // ============================================================
    // CONFIGURACIÓN
    // Cambia este número por tu WhatsApp (código de país + número, sin +, espacios ni guiones)
    // Ejemplo México: 521234567890
    // ============================================================
    const TELEFONO_WHATSAPP = "521234567890";

    const form = document.getElementById("reporteForm");
    const btnEnviar = document.getElementById("btnEnviar");

    // ------------------------------------------------------------
    // Utilidades de validación
    // ------------------------------------------------------------

    function estaVacio(el) {
      if (el.type === "checkbox" || el.type === "radio") {
        return !el.checked;
      }
      if (el.tagName === "SELECT") {
        return el.value === "";
      }
      return !el.value.trim();
    }

    function obtenerCamposRequeridos() {
      return [...form.querySelectorAll("[required]")];
    }

    function limpiarErrores(campos) {
      campos.forEach(c => {
        c.classList.remove("campo-error");
        const errorMsg = c.closest(".campo")?.querySelector(".error-msg");
        if (errorMsg) errorMsg.classList.remove("visible");
      });
    }

    function marcarError(campo) {
      campo.classList.add("campo-error");
      const errorMsg = campo.closest(".campo")?.querySelector(".error-msg");
      if (errorMsg) errorMsg.classList.add("visible");
    }

    function irAlPrimerFaltante(campo) {
      // Scroll suave hasta el campo
      campo.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      // Esperar a que termine el scroll y enfocar sin mover de nuevo
      setTimeout(() => {
        campo.focus({ preventScroll: true });
      }, 450);
    }

    // ------------------------------------------------------------
    // Construir mensaje para WhatsApp
    // ------------------------------------------------------------

    function construirMensaje() {
      const lineas = [];
      const campos = [...form.querySelectorAll("[name]")];

      campos.forEach(el => {
        const label = el.dataset.label || el.name;
        let valor = "";

        if (el.type === "checkbox") {
          valor = el.checked ? "Sí" : "No";
        } else if (el.type === "radio") {
          if (el.checked) {
            valor = el.value;
          } else {
            return; // omitir radios no seleccionados
          }
        } else {
          valor = el.value.trim();
        }

        // Si no es requerido y está vacío, se omite del mensaje
        if (!el.required && valor === "") return;

        lineas.push(`${label}: ${valor}`);
      });

      return lineas.join("\n");
    }

    // ------------------------------------------------------------
    // Función principal
    // ------------------------------------------------------------

    function enviarReporte() {
      const camposRequeridos = obtenerCamposRequeridos();
      limpiarErrores(camposRequeridos);

      // Detectar campos vacíos
      const faltantes = camposRequeridos.filter(estaVacio);

      if (faltantes.length > 0) {
        // Marcar todos los faltantes
        faltantes.forEach(marcarError);

        // Llevar al primero
        irAlPrimerFaltante(faltantes[0]);

        // Aviso opcional con todos los campos que faltan
        const nombres = faltantes.map(c => c.dataset.label || c.name).join(", ");
        alert(`Faltan los siguientes datos: ${nombres}`);

        return; // No se envía nada
      }

      // Todo completo: construir mensaje y abrir WhatsApp
      const mensaje = construirMensaje();
      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;

      window.open(url, "_blank");
    }

    // ------------------------------------------------------------
    // Eventos
    // ------------------------------------------------------------

    btnEnviar.addEventListener("click", enviarReporte);

    // Permitir enviar con Enter (excepto en textarea)
    form.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
        e.preventDefault();
        enviarReporte();
      }
    });
  </script>
</body>
</html>
